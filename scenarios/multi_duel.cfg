# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = multi_duel.wad
game_args = -deathmatch +sv_spawnfarthest 1
episode_timeout = 2100

screen_resolution = RES_320X240
screen_format = CRCGCB
render_hud = true
render_crosshair = true

available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        TURN_LEFT
        TURN_RIGHT
        ATTACK
    }

# SELECTED_WEAPON_AMMO is used by DeathmatchRewardWrapper to penalize fired rockets
# USER51/52: rockets of player 0/1, USER54/55: alive flags, USER57/58: line of sight
# player 0->1 / 1->0, USER59/60: |yaw error| to the opponent in millidegrees
available_game_variables = { HEALTH DEATHCOUNT FRAGCOUNT DAMAGECOUNT DAMAGE_TAKEN DEAD SELECTED_WEAPON_AMMO USER51 USER52 USER54 USER55 USER57 USER58 USER59 USER60 }

mode = PLAYER
doom_skill = 5
