# Player 0 is the speaker
# Player 1 is the mover

doom_scenario_path = simple_communication.wad
doom_map = map01

# Rewards are calculated by the training wrapper (USER40-47 deltas).
living_reward = 0
death_reward = 0

# Rendering options
screen_resolution = RES_320X240
screen_format = CRCGCB
render_hud = false
render_crosshair = false
render_weapon = false
render_decals = false
render_particles = false
window_visible = false

# Make episodes finish after 700 actions (tics)
episode_timeout = 700

# Text channel: console lines from the last `notifications_buffer_size` tics
# (ACS HudMessage with HUDMSG_LOG to this player, chat `say` from any player)
notifications_buffer_enabled = true
notifications_buffer_size = 4

# Available buttons
available_buttons =
    {
        MOVE_FORWARD
        MOVE_BACKWARD
        MOVE_LEFT
        MOVE_RIGHT
        TURN_LEFT
        TURN_RIGHT
        USE
    }

# Game variables that will be in the state
# USER40: stage (1 while unsolved, 2 once solved)
# USER41: solved flag
# USER42: wrong presses
# USER43: secret colour (1 RED, 2 GREEN)
# USER44: speaker player number
# USER45: colour of the last press
# USER46: the speaker has been shown the colour
# USER47: mirrors USER41
available_game_variables = { POSITION_X POSITION_Y ANGLE USER40 USER41 USER42 USER43 USER44 USER45 USER46 USER47 }

mode = PLAYER
doom_skill = 1
