# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = multi_duel_hide_and_seek.wad
# +turnspeeds 160: binary TURN_* rotate 1.8 deg on the first skip: 4 step and
# 3.5 deg when held (vanilla 640: 7 / 14 deg), so the shooter can aim within
# the +-8 deg rocket splash tolerance at 600-900 units
game_args = -deathmatch +sv_spawnfarthest 1 +turnspeeds 160
episode_timeout = 2100

# The PettingZoo HideAndSeekRewardWrapper owns the zero-sum round reward.
living_reward = 0
death_reward = 0
kill_reward = 0

screen_resolution = RES_320X240
screen_format = CRCGCB
render_hud = true
render_crosshair = true

available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        MOVE_FORWARD
        MOVE_BACKWARD
        TURN_LEFT
        TURN_RIGHT
        ATTACK
    }

# SELECTED_WEAPON_AMMO: shooter's rocket in hand (0/1)
# USER51: shooter rockets in hand, USER52: rockets still to be granted this round,
# USER53: round over (budget spent + 3 s grace) -> hider_escape,
# USER54/55: alive flags shooter/hider, USER56: rockets fired this round,
# USER57/58: line of sight shooter->hider / hider->shooter,
# USER59/60: |yaw error| shooter->hider / hider->shooter in millidegrees
available_game_variables = { HEALTH DEATHCOUNT FRAGCOUNT DAMAGECOUNT DAMAGE_TAKEN DEAD SELECTED_WEAPON_AMMO USER51 USER52 USER53 USER54 USER55 USER56 USER57 USER58 USER59 USER60 }

mode = PLAYER
doom_skill = 5
