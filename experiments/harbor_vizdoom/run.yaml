job_name: vizdoom-doom1-doom2-codex-vs-claude
jobs_dir: experiments/harbor_vizdoom/jobs/models-codex-openai_gpt-5.6-luna__claude-code-anthropic_claude-sonnet-4-6/reasoning-codex-medium__claude-code-medium/seed-${VIZDOOM_SEED}
n_attempts: 1
n_concurrent_trials: 1
quiet: false

environment:
  type: docker
  force_build: true
  delete: true

agents:
  - name: codex
    model_name: openai/gpt-5.6-luna
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    kwargs:
      reasoning_effort: medium
      web_search: disabled

  - name: claude-code
    model_name: anthropic/claude-sonnet-4-6
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    kwargs:
      reasoning_effort: medium
      disallowed_tools: WebSearch,WebFetch

tasks:
  - path: experiments/harbor_vizdoom/tasks/doom-e1m1
  - path: experiments/harbor_vizdoom/tasks/doom-e1m2
  - path: experiments/harbor_vizdoom/tasks/doom2-map01
  - path: experiments/harbor_vizdoom/tasks/doom2-map02
