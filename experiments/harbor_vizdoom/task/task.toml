schema_version = "1.4"

# The verifier evidence comes from the ViZDoom sidecar. These paths are
# materialized at the same absolute locations in the separate verifier image.
artifacts = [
    { source = "/vizdoom-results/result.json", service = "vizdoom" },
    { source = "/vizdoom-results/events.jsonl", service = "vizdoom" },
    { source = "/vizdoom-results/recording.mp4", service = "vizdoom" },
]

[task]
name = "vizdoom/basic-multibinary-mcp"
description = "Kill the monster in ViZDoom BASIC by acting through visual MCP tools."
authors = [{ name = "ViZDoom" }]
keywords = ["vizdoom", "vision", "mcp", "game-agent", "multibinary"]

[metadata]
difficulty = "easy"
category = "embodied-agent"
environment_id = "VizdoomBasic-MultiBinary-v1"
frame_skip = 4

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[[verifier.collect]]
service = "vizdoom"
command = 'kill -USR1 1; i=0; while [ ! -s /vizdoom-results/finalized ] && [ "$i" -lt 180 ]; do sleep 1; i=$((i + 1)); done; test -s /vizdoom-results/recording.mp4'
timeout_sec = 240.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "vizdoom"
transport = "streamable-http"
url = "http://vizdoom:8000/mcp"
args = []

[solution.env]

[verifier.env]

[environment.env]
